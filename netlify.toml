[build]
  # Build, measure the real exported weight into src/data/perf.json, then
  # rebuild so the /perf page and Perf HUD ship the fresh numbers.
  command = "npm run build && node scripts/measure-perf.mjs && npm run build"
  publish = "out"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
